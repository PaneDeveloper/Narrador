<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Narrador de Texto</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:Arial;background:#f2f2f2;padding:20px}
.container{max-width:700px;margin:auto;background:white;padding:20px;border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,0.1)}
textarea{width:100%;height:160px;padding:10px;font-size:16px}
select,input{width:100%;margin-top:6px;padding:6px}
button{padding:10px;margin-top:10px;margin-right:5px;font-size:16px;border:none;border-radius:6px;cursor:pointer}
.play{background:#28a745;color:white}
.stop{background:#dc3545;color:white}
.save{background:#007bff;color:white}
.status{margin-top:10px;font-weight:bold}
</style>
</head>
<body>
<div class="container">
<h2>Narrador de Texto</h2>
<textarea id="text" placeholder="Digite alguns Caracteres aqui pra narrar <3" oninput="checkSave()"></textarea>
<label>Voz</label>
<select id="voice"></select>
<label>Velocidade</label>
<input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">
<label>Tom</label>
<input type="range" id="pitch" min="0" max="2" step="0.1" value="1">
<br>
<button class="play" onclick="speak()">Ler</button>
<button class="stop" onclick="stopSpeak()">Parar</button>
<button class="save" id="saveBtn" onclick="saveAudio()" disabled>Salvar áudio</button>
<div class="status" id="status"></div>
</div>
<script>
let synth = window.speechSynthesis
let voices = []

function status(msg){
 document.getElementById("status").innerText = msg
}

function loadVoices(){
 if(!window.speechSynthesis) return

 voices = speechSynthesis.getVoices()
 const select = document.getElementById("voice")

 select.innerHTML = ""

 // se não vier voz ainda
 if(voices.length === 0){
  setTimeout(loadVoices,200)
  return
 }

 voices.forEach((v,i)=>{
  const option = document.createElement("option")
  option.value = i
  option.text = v.name + " (" + v.lang + ")"
  select.appendChild(option)
 })
}

// alguns navegadores só carregam vozes depois
if('speechSynthesis' in window){
 loadVoices()
 speechSynthesis.onvoiceschanged = loadVoices
}

function speakDevice(text){
 const utter = new SpeechSynthesisUtterance(text)

 const v = document.getElementById("voice").value
 if(voices[v]) utter.voice = voices[v]

 utter.rate = document.getElementById("rate").value
 utter.pitch = document.getElementById("pitch").value

 synth.cancel()
 synth.speak(utter)

 status("Narrador do dispositivo")
}

function speak(){
 const text = document.getElementById("text").value.trim()

 if(text === ""){
  const aviso = "Por favor, escreva algumas palavras na Caixa de Texto"
  speakDevice(aviso)
  return
 }

 // texto grande
 if(text.length > 200){
  status("Texto grande. Usando narrador do dispositivo")
  speakDevice(text)
  return
 }

 const url = "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=pt&q=" + encodeURIComponent(text)

 const audio = new Audio(url)

 audio.onerror = function(){
  status("Erro no Google TTS. Mudando para narrador do dispositivo")
  speakDevice(text)
 }

 audio.play().catch(()=>{
  status("Erro no Google TTS. Mudando para narrador do dispositivo")
  speakDevice(text)
 })

 status("Google TTS")
}

function stopSpeak(){
 if(synth) synth.cancel()
 status("Parado")
}

function checkSave(){
 const text = document.getElementById("text").value.trim()
 document.getElementById("saveBtn").disabled = !(text && text.length <= 200)
}

function saveAudio(){
 const text = document.getElementById("text").value.trim()

 if(!text || text.length > 200){
  status("Para salvar o áudio o texto precisa ter até 200 caracteres")
  return
 }

 const url = "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=pt&q=" + encodeURIComponent(text)

 const a = document.createElement("a")
 a.href = url
 a.download = "narracao.mp3"

 document.body.appendChild(a)
 a.click()
 document.body.removeChild(a)

 status("Download iniciado")
}
</script>
</body>
</html>
