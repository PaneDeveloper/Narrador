<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Narrador de Texto</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:Arial;background:#f2f2f2;padding:20px}
.container{max-width:700px;margin:auto;background:white;padding:20px;border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,0.1)}
textarea{width:100%;height:160px;padding:10px;font-size:16px}
select,input{width:100%;margin-top:6px;padding:6px}
button{padding:10px;margin-top:10px;margin-right:5px;font-size:16px;border:none;border-radius:6px;cursor:pointer}
.play{background:#28a745;color:white}
.stop{background:#dc3545;color:white}
.save{background:#007bff;color:white}
.status{margin-top:10px;font-weight:bold}
</style>
</head>
<body>
<div class="container">
<h2>Narrador de Texto</h2>
<textarea id="text" placeholder="Digite ou cole o texto aqui..." oninput="checkSave()"></textarea>
<label>Voz</label>
<select id="voice"></select>
<label>Velocidade</label>
<input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">
<label>Tom</label>
<input type="range" id="pitch" min="0" max="2" step="0.1" value="1">
<br>
<button class="play" onclick="speak()">Ler</button>
<button class="stop" onclick="stopSpeak()">Parar</button>
<button class="save" id="saveBtn" onclick="saveAudio()" disabled>Salvar áudio</button>
<div class="status" id="status"></div>
</div>
<script>
let synth = window.speechSynthesis
let voices = []
function status(msg){document.getElementById("status").innerText = msg}
function loadVoices(){voices = synth.getVoices();let select = document.getElementById("voice");select.innerHTML="";voices.forEach((v,i)=>{if(v.lang.startsWith("pt")){let option=document.createElement("option");option.value=i;option.text=v.name+" ("+v.lang+")";select.appendChild(option)}})}
if(synth){loadVoices();speechSynthesis.onvoiceschanged = loadVoices}
function speakDevice(text){let utter = new SpeechSynthesisUtterance(text);let v = document.getElementById("voice").value;if(voices[v]) utter.voice = voices[v];utter.rate = document.getElementById("rate").value;utter.pitch = document.getElementById("pitch").value;synth.speak(utter);status("Narrador do dispositivo")}
function speak(){let text = document.getElementById("text").value.trim();if(text===""){let aviso="Por favor, escreva algumas palavras na Caixa de Texto";speakDevice(aviso);return}
if(text.length>200){status("Texto grande. Usando narrador do dispositivo");speakDevice(text);return}
let url="https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=pt&q="+encodeURIComponent(text)
let audio=new Audio(url)
audio.onerror=function(){status("Erro no Google TTS ou no dispositivo");speakDevice(text)}
audio.play().catch(function(){status("Erro no Google TTS")})
status("Google TTS")}
function stopSpeak(){if(synth) synth.cancel();status("Parado")}
function checkSave(){let text=document.getElementById("text").value.trim();document.getElementById("saveBtn").disabled = !(text && text.length<=200)}
function saveAudio(){let text=document.getElementById("text").value.trim();if(!text || text.length>200){status("Para salvar o áudio o texto precisa ter até 200 caracteres");return}
let url="https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=pt&q="+encodeURIComponent(text)
let a=document.createElement("a");a.href=url;a.download="narracao.mp3";document.body.appendChild(a);a.click();document.body.removeChild(a);status("Download iniciado")}
</script>
</body>
</html>
