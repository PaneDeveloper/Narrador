<!DOCTYPE html>
<!--
NARRADOR PRO - LOCAL SERVER EDITION

O QUE ESTE ARQUIVO FAZ
- Lê qualquer texto digitado usando o narrador do próprio dispositivo (Web Speech API).
- Funciona totalmente OFFLINE.
- Não precisa de servidor externo nem API.

COMPATIBILIDADE
Funciona em navegadores que suportam speechSynthesis:
- Chrome
- Chromium
- Opera
- Edge
- Android WebView

Sistemas suportados:
- Linux
- Windows
- Android
- ChromeOS

COMO ELE SE ADAPTA AO DISPOSITIVO
- Detecta automaticamente todas as vozes instaladas no sistema.
- Atualiza a lista quando o navegador libera as vozes.
- Seleciona automaticamente português quando disponível.
- Usa loops de verificação para funcionar em hardware antigo.

OTIMIZAÇÕES
- Código JS simples para rodar em celulares antigos.
- Evita travamentos cancelando a fila de fala.
- Usa verificação periódica de vozes.
- Desperta o motor de TTS para evitar bugs de navegador.

Tudo roda diretamente no navegador.
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Narrador Pro - Local 'Server' Edition</title>
<style>
body{
background-color:#1a202c;
color:#333;
font-family:Arial,sans-serif;
margin:0;
padding:15px;
}
.container{
background-color:#ffffff;
max-width:600px;
margin:20px auto;
padding:20px;
border-radius:8px;
box-shadow:0 4px 6px rgba(0,0,0,0.3);
}
h1{
font-size:18px;
color:#2d3748;
margin:0 0 15px 0;
border-bottom:2px solid #4a5568;
padding-bottom:5px;
}
textarea{
width:100%;
height:150px;
box-sizing:border-box;
padding:10px;
border:2px solid #cbd5e0;
font-size:16px;
margin-bottom:15px;
}
.controls{
background:#f7fafc;
padding:10px;
border-radius:5px;
margin-bottom:15px;
}
label{
display:block;
font-size:12px;
font-weight:bold;
margin-bottom:5px;
}
select,input[type="range"]{
width:100%;
margin-bottom:10px;
}
.btn{
display:block;
width:100%;
padding:15px;
font-size:16px;
font-weight:bold;
text-align:center;
border:none;
border-radius:5px;
cursor:pointer;
margin-bottom:10px;
}
.btn-play{background-color:#3182ce;color:white;}
.btn-stop{background-color:#e53e3e;color:white;}
#status{
text-align:center;
font-size:12px;
color:#a0aec0;
margin-top:10px;
}
</style>
</head>
<body>

<div class="container">
<h1>Narrador Local (Offline)</h1>

<textarea id="text" placeholder="Escreva aqui para o servidor narrar..."></textarea>

<div class="controls">
<label>
<input type="checkbox" id="usarGtts" checked>
Usar Google TTS (voz online)
</label>
<label>Voz do Dispositivo:</label>
<select id="voice">
<option>Carregando Vozes</option> <!-- A carregar vozes, aqui é BR na raça, hehehehehehe -->
</select>

<label>Velocidade</label>
<input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">

<label>Tom</label>
<input type="range" id="pitch" min="0" max="2" step="0.1" value="1">
</div>

<!-- Botão para ativar ou desativar Google TTS (gTTS Web). Quando desligado, usa apenas as vozes locais do dispositivo -->
<div style="margin-bottom:10px; font-size:12px;">
<label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
<input type="checkbox" id="usarGTTS"> Usar Google TTS (voz da web)
</label>
</div>

<button class="btn btn-play" onclick="falar()">FALAR (LOCAL)</button>
<button class="btn btn-stop" onclick="parar()">PARAR TUDO</button>
<button class="btn" style="background:#38a169;color:white" onclick="baixarAudio()">BAIXAR ÁUDIO (Google TTS)</button>

<div id="status">Engine Pronta. Offline.</div> <!-- Servidor é um browser, instalado no dispositivo de alguem por aí, e esse alguem, é uma pessoa provávelmente no computador vendo essa mensagem num código HTML de Narrador, que é um PWA, pelo aplicativo IDE denominado Microsoft Visual Studio Code, e, que é um usuário curioso :3 -->
</div>

<script>

var synth = window.speechSynthesis
var vozes = []
var vSelect = document.getElementById("voice")
var statusTxt = document.getElementById("status")

function despertarTTS(){
if(!synth) return
var dummy = new SpeechSynthesisUtterance(" ")
dummy.volume = 0
synth.speak(dummy)
synth.cancel()
}

function carregarVozes(){

if(!synth){
statusTxt.innerText="Erro: síntese de voz não suportada"
return
}

var vozesDisponiveis = synth.getVoices()

if(vozesDisponiveis.length>0 && vozesDisponiveis.length!==vozes.length){

vozes = vozesDisponiveis
vSelect.innerHTML=""

// LISTA TODAS AS VOZES DO DISPOSITIVO (todas as línguas)
// NÃO filtra idioma de propósito, para mostrar todas as vozes instaladas
// no sistema: português, inglês, japonês, coreano, etc.
for(var i=0;i<vozes.length;i++){

var opt=document.createElement("option")
opt.value=i
opt.textContent=vozes[i].name+" ["+vozes[i].lang+"]"

if(vozes[i].lang.indexOf('pt')!==-1){
opt.selected=true
}

vSelect.appendChild(opt)

}

statusTxt.innerText="As Vozes Offline foram carregadas ("+vozes.length+")"

}

}

if(synth && synth.onvoiceschanged!==undefined){
synth.onvoiceschanged=carregarVozes
}

var tentaCargar=setInterval(function(){ 

carregarVozes()

if(vozes.length>0){
clearInterval(tentaCargar)
setInterval(carregarVozes,10000)
}
  //Primeira regra da Programação!
  
//"
  //Se tá funcionando, não meche.  
                                  "
                              
  //Usuário Aleatório denominado Pane Developer
},500)

function falar(){

var txt=document.getElementById("text").value.trim()
var usarGtts=document.getElementById("usarGtts").checked

if(!txt){
statusTxt.innerText=traduzir("write_first")
return
}

// se Google TTS estiver ativo e texto pequeno
if(usarGtts && txt.length<=200){

var url="https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl="+idiomaBase()+"&q="+encodeURIComponent(txt)

var audio=new Audio(url)

audio.onplay=function(){statusTxt.innerText=traduzir("speaking_web")}
audio.onerror=function(){
statusTxt.innerText=traduzir("web_error")
falarLocal(txt)
}

audio.play().catch(function(){
falarLocal(txt)
})

return
}

// fallback local
falarLocal(txt)

}

function falarLocal(txt){

if(vozes.length===0){
statusTxt.innerText=traduzir("voices_loading")
carregarVozes()
return
}

synth.cancel()

var msg=new SpeechSynthesisUtterance(txt)

var vIndex=vSelect.value

if(vozes[vIndex]){
msg.voice=vozes[vIndex]
msg.lang=vozes[vIndex].lang
}

msg.rate=document.getElementById("rate").value
msg.pitch=document.getElementById("pitch").value

msg.onstart=function(){statusTxt.innerText=traduzir("speaking_local")}
msg.onend=function(){statusTxt.innerText=traduzir("done")}
msg.onerror=function(){statusTxt.innerText=traduzir("local_error")}

synth.speak(msg)

}

}

function parar(){
if(synth) synth.cancel()
statusTxt.innerText="Interrompido ._."
}

function getAutorNome(){

var lang = (navigator.language || "pt").toLowerCase()

if(lang.indexOf("pt")===0) return "Narrador TTS por Pane Developer"
if(lang.indexOf("es")===0) return "Narrador TTS por Pane Developer"

return "TTS Narrator by Pane Developer"

}

function baixarAudio(){

var txt=document.getElementById("text").value.trim()

if(!txt){
statusTxt.innerText="Escreve algo aí parcero '-'"
return
}

if(txt.length>200){
statusTxt.innerText="Download limitado a 200 caracteres"
return
}

var url="https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=pt&q="+encodeURIComponent(txt)

var autor=getAutorNome()

var nomeArquivo="TTS_Web - "+autor+".mp3"

var a=document.createElement("a")

a.href=url

a.download=nomeArquivo

document.body.appendChild(a)

a.click()

document.body.removeChild(a)

statusTxt.innerText="Download iniciado"
}

function idiomaBase(){
var lang=(navigator.language||"pt-BR").toLowerCase()
if(lang.indexOf("pt")==0) return "pt"
if(lang.indexOf("es")==0) return "es"
return "en"
}

function traduzir(chave){
var lang=idiomaBase()

var textos={
pt:{
write_first:"Escreva algo primeiro",
speaking_web:"A falar (Google TTS)...",
speaking_local:"A falar (voz do dispositivo)...",
voices_loading:"Aguarde... vozes ainda a carregar",
done:"Pronto.",
web_error:"Erro no Google TTS, usando voz local",
local_error:"Erro na fala local"
},
es:{
write_first:"Escribe algo primero",
speaking_web:"Hablando (Google TTS)...",
speaking_local:"Hablando (voz del dispositivo)...",
voices_loading:"Esperando voces del sistema",
done:"Listo",
web_error:"Error en Google TTS, usando voz local",
local_error:"Error de voz local"
},
en:{
write_first:"Write something first",
speaking_web:"Speaking (Google TTS)...",
speaking_local:"Speaking (device voice)...",
voices_loading:"Waiting for voices",
done:"Done",
web_error:"Google TTS error, using device voice",
local_error:"Local speech error"
}
}
// lembra daquela bagaça lá do inicio que mal funcionava?
  // taí KKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKK
  // Funcionando, eu espero >:3
  // te amo kkkk
  // O Código é Open-Source, ou seja, código aberto, e é de Uso Livre :3
  // Baixou é seu, tudo de boas.
  // Feito por Pane Developer <3
return textos[lang][chave]||textos.pt[chave]
}

window.onload=function(){
despertarTTS()
}

</script>

</body>
</html>
