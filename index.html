<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Narrador de Texto</title>

<style>
body{
font-family: Arial, sans-serif;
background:#f2f2f2;
margin:0;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

textarea{
width:100%;
height:160px;
padding:10px;
font-size:16px;
}

select,input{
width:100%;
padding:8px;
margin-top:5px;
}

button{
padding:10px;
margin-top:10px;
width:48%;
font-size:16px;
border:none;
border-radius:6px;
cursor:pointer;
}

.play{background:#28a745;color:white;}
.stop{background:#dc3545;color:white;}

.status{
margin-top:10px;
font-weight:bold;
}

.controls{
display:flex;
justify-content:space-between;
}
</style>
</head>

<body>

<div class="container">

<h2>Narrador de Texto</h2>

<textarea id="text" placeholder="Digite ou cole seu texto aqui..."></textarea>

<label>Voz</label>
<select id="voice"></select>

<label>Velocidade</label>
<input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">

<label>Tom</label>
<input type="range" id="pitch" min="0" max="2" step="0.1" value="1">

<div class="controls">
<button class="play" onclick="speak()">Ler</button>
<button class="stop" onclick="stopSpeak()">Parar</button>
</div>

<div class="status" id="status"></div>

</div>

<script>

var synth = window.speechSynthesis;
var voices = [];

function status(msg){
document.getElementById("status").innerText = msg;
}

function loadVoices(){

if(!synth) return;

voices = synth.getVoices();
var select = document.getElementById("voice");

select.innerHTML="";

for(var i=0;i<voices.length;i++){

if(voices[i].lang.indexOf("pt")===0){

var option=document.createElement("option");
option.value=i;
option.text=voices[i].name+" ("+voices[i].lang+")";

select.appendChild(option);

}

}

}

if(synth){

loadVoices();

if(speechSynthesis.onvoiceschanged!==undefined){
speechSynthesis.onvoiceschanged=loadVoices;
}

}

function speakDevice(text){

if(!("speechSynthesis" in window)) return;

var utter=new SpeechSynthesisUtterance(text);

var select=document.getElementById("voice");

if(voices.length>0){
utter.voice=voices[select.value];
}

utter.rate=document.getElementById("rate").value;
utter.pitch=document.getElementById("pitch").value;

synth.speak(utter);

status("Lendo com narrador do dispositivo.");

}

function speak(){

var text=document.getElementById("text").value.trim();

if(text===""){

var aviso="Por favor, escreva algumas palavras na Caixa de Texto.";

status(aviso);

speakDevice(aviso);

return;
}

if(text.length>200){

status("Texto longo detectado. Usando narrador do dispositivo.");

speakDevice(text);

return;
}

var url="https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=pt&q="+encodeURIComponent(text);

var audio=new Audio();
audio.src=url;

audio.onerror=function(){

status("Erro no Google TTS. Mudando para o narrador do dispositivo.");

speakDevice(text);

};

audio.onended=function(){

status("Leitura concluída.");

};

audio.play().catch(function(){

status("Erro ao tocar Google TTS. Usando narrador do dispositivo.");

speakDevice(text);

});

status("Lendo com Google TTS.");

}

function stopSpeak(){

if("speechSynthesis" in window){
synth.cancel();
}

status("Leitura parada.");

}

</script>

</body>
</html>
