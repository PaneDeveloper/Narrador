<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Narrador de Texto '-'</title><style>body{background:#1a202c;color:#fff;font-family:Arial,sans-serif;margin:0;padding:15px;}.container{background:#2d3748;max-width:600px;margin:20px auto;padding:20px;border-radius:8px;box-shadow:0 4px 6px rgba(0,0,0,0.3);}h1{font-size:20px;margin-bottom:15px;border-bottom:2px solid #4a5568;padding-bottom:5px;}textarea{width:100%;height:150px;padding:10px;font-size:16px;margin-bottom:15px;border-radius:5px;border:none;resize:none;}.controls{background:#4a5568;padding:10px;border-radius:5px;margin-bottom:15px;}label{display:block;font-size:12px;font-weight:bold;margin-bottom:5px;}select,input[type=range]{width:100%;margin-bottom:10px;}.btn{display:block;width:100%;padding:15px;font-size:16px;font-weight:bold;text-align:center;border:none;border-radius:5px;cursor:pointer;margin-bottom:10px;}.btn-play{background:#3182ce;color:white;}.btn-stop{background:#e53e3e;color:white;}.btn-download{background:#38a169;color:white;}.btn-download.disabled{background:#000;cursor:not-allowed;}#status{text-align:center;font-size:12px;color:#a0aec0;margin-top:10px;}</style></head><body>

<!-- 
    NOTA PARA OS CURIOSOS: 
    Este código usa um padrão de HTML/JS mais direto e "antigo" propositalmente. 
    O motivo? Compatibilidade total com dispositivos Android antigos e browsers que 
    não lidam bem com frameworks pesados. Funciona 100% em browsers novos e sistemas modernos 
    também, mas garante que até aquele seu celular de guerra não fique na mão! kkk
-->

<div class="container"><h1>Narrador Local (Android TTS Padrão)</h1><textarea id="text" placeholder="Escreva algo para o narrador falar..."></textarea>
<div class="controls"><!-- Checkbox para ativar Google TTS --><label><input type="checkbox" id="usarGtts"> Usar o Google TTS pra Download do Arquivo</label><!-- Seleção de vozes --><label>Voz do dispositivo:</label><select id="voice"><option value="">Buscando vozes no sistema...</option></select><label>Velocidade</label><input type="range" id="rate" min="0.5" max="2" step="0.1" value="1"><label>Tom</label><input type="range" id="pitch" min="0" max="2" step="0.1" value="1"></div>
<!-- Botões de ação --><button class="btn btn-play" onclick="falar()">Falar</button><button class="btn btn-stop" onclick="parar()">Parar</button><button id="btnDownload" class="btn btn-download" onclick="baixarAudio()">Baixar Arquivo</button><div id="status">Iniciando...</div></div>
<script>
var synth = window.speechSynthesis;
var vozes = [];
var vSelect = document.getElementById("voice");
var statusTxt = document.getElementById("status");
var btnDownload = document.getElementById("btnDownload");
var gravador;
var pedacosAudio = [];
var carregouUmaVez = false;

// Função mestre para carregar as vozes sem travar no loop
function carregarVozes() {
    if (!synth) {
        statusTxt.innerText = "Erro: API de voz não encontrada.";
        return;
    }

    var lista = synth.getVoices();
    
    if (lista.length > 0) {
        // Se a lista mudou ou é a primeira vez, a gente popula o select
        if (lista.length !== vozes.length || !carregouUmaVez) {
            vozes = lista;
            vSelect.innerHTML = "";
            var encontrouPT = false;

            for (var i = 0; i < vozes.length; i++) {
                var opt = document.createElement("option");
                opt.value = i;
                opt.textContent = vozes[i].name + " (" + vozes[i].lang + ")";
                
                // Prioridade total para PT-BR
                if (!encontrouPT && (vozes[i].lang.indexOf('pt') === 0)) {
                    opt.selected = true;
                    encontrouPT = true;
                }
                vSelect.appendChild(opt);
            }
            statusTxt.innerText = "Vozes prontas: " + vozes.length;
            carregouUmaVez = true;
        }
    } else {
        // Truque do Android: Se as vozes sumirem, a gente "espeta" o sistema de novo
        statusTxt.innerText = "Sincronizando vozes...";
    }
}

// O pulo do gato: rodar o carregamento em loop curto até dar certo
if (synth) {
    if (synth.onvoiceschanged !== undefined) {
        synth.onvoiceschanged = carregarVozes;
    }
    // Tenta carregar na hora e a cada 400ms se estiver vazio
    carregarVozes();
    var loopVozes = setInterval(function() {
        if (vozes.length > 0 && carregouUmaVez) {
            // Se já carregou, diminui a frequência da checagem
            clearInterval(loopVozes);
            setInterval(carregarVozes, 2000); 
        } else {
            carregarVozes();
        }
    }, 400);
}

function falar() {
    var txt = document.getElementById("text").value.trim();
    var usarGtts = document.getElementById("usarGtts").checked;
    
    if (!txt) { statusTxt.innerText = "Digite algo primeiro!"; return; }

    if (usarGtts && navigator.onLine && txt.length <= 200) {
        statusTxt.innerText = "Chamando Google TTS...";
        var url = "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=pt&q=" + encodeURIComponent(txt);
        var audio = new Audio(url);
        audio.play().catch(function() { falarLocal(txt); });
        return;
    }
    falarLocal(txt);
}

function falarLocal(txt) {
    if (!synth) return;

    // Se as vozes não apareceram, tenta forçar uma última vez
    if (vozes.length === 0) {
        carregarVozes();
        statusTxt.innerText = "Erro: Vozes não disponíveis no momento.";
        return;
    }

    synth.cancel(); 
    var msg = new SpeechSynthesisUtterance(txt);
    var vIndex = vSelect.value;
    
    if (vozes[vIndex]) {
        msg.voice = vozes[vIndex];
        msg.lang = vozes[vIndex].lang;
    }

    msg.rate = document.getElementById("rate").value;
    msg.pitch = document.getElementById("pitch").value;

    msg.onstart = function() { statusTxt.innerText = "Processando áudio..."; };
    msg.onend = function() { 
        statusTxt.innerText = "Fim da fala."; 
        if (gravador && gravador.state === "recording") {
            setTimeout(function(){ gravador.stop(); }, 500); // Delay pra não cortar o final
        }
    };
    msg.onerror = function(e) { statusTxt.innerText = "Erro no motor local: " + e.error; };

    synth.speak(msg);
}

function parar() {
    if (synth) synth.cancel();
    if (gravador && gravador.state === "recording") gravador.stop();
    statusTxt.innerText = "Interrompido.";
}

async function baixarAudio() {
    var txt = document.getElementById("text").value.trim();
    if (!txt) return;

    var usarGtts = document.getElementById("usarGtts").checked;

    if (usarGtts && navigator.onLine && txt.length <= 200) {
        var url = "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=pt&q=" + encodeURIComponent(txt);
        var link = document.createElement("a");
        link.href = url;
        link.target = "_blank";
        link.download = "audio_google.mp3";
        link.click();
        return;
    }

    statusTxt.innerText = "Gravando voz local... Fique em silêncio!";
    try {
        var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        gravador = new MediaRecorder(stream);
        pedacosAudio = [];

        gravador.ondataavailable = function(e) { if (e.data.size > 0) pedacosAudio.push(e.data); };
        gravador.onstop = function() {
            var blob = new Blob(pedacosAudio, { type: 'audio/webm' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement("a");
            a.href = url;
            a.download = "narracao_local.webm";
            a.click();
            stream.getTracks().forEach(t => t.stop());
            statusTxt.innerText = "WebM gerado com sucesso!";
        };

        gravador.start();
        falarLocal(txt);
    } catch (err) {
        statusTxt.innerText = "Erro: Preciso do microfone para gravar o som local.";
    }
}

// Acorda o motor de voz logo de cara
window.onload = function() {
    if (synth) synth.cancel();
    setTimeout(carregarVozes, 500);
};
</script></body></html>
